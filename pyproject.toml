[project]
name = "pn"
version = "0.1.0"
dependencies = [
    "mne>=1.12.1",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch",
    "neurodsp",
    "ezmsg",
    "CorticomUnits",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# note: if using a different version of cuda, modify the values in both tool.uv.source and tool.uv.index
# eg cuda 11.8 would be pytorch-cu118, .../whl/cu118
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# Note: This package is found on CroneLab git. 
CorticomUnits = {path = "C:/Users/Becca/Documents/CorticomUnits"}



[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true